# Progressive symbol map for Strike Gunner S.T.G.
#
# Each [[func]] names an address the analyzer should treat as a function.
# Set emit = true to promote one into ahead-of-time codegen; leave it false
# to keep it interpreted. tools/regen.sh syncs labels and tier choices into
# each recomp/bankNN.cfg; only emit=true adds a func/funcs.h declaration.
# Do not hand-edit the generated blocks in the bank configs.

[[func]]
name = "I_RESET"
addr = "8000"
bank = 0
emit = false
note = "Emulation RESET vector ($FFFC)"

[[func]]
name = "I_NMI"
addr = "86c4"
bank = 0
emit = false
note = "Native NMI vector ($FFEA)"

# Object handlers: the per-frame object loop at $03:8200 walks 128 slots
# ($056F + $20*n) and calls the handler for each slot type byte through the
# 256-entry table at $03:8000 (JSR $8247 -> JML [$9C]), with A 8-bit and X
# 16-bit. Every table entry is listed so enemies from stages a coverage
# capture never reached are compiled too. Named by the first type index
# that uses each handler; obj_null_86ed is the bare RTS for empty types.

[[func]]
name = "obj_null_86ed"
addr = "86ed"
bank = 3
emit = true
entry_m = 1
entry_x = 0

