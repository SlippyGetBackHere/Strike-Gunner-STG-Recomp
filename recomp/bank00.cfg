# Strike Gunner S.T.G (USA) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $8000, native NMI $86c4 (from the cartridge header).

# Frame waits: compiled callers hand these back to the scheduler
# (src/gen_stubs.c).
hle_func 83c9 HleStgWaitNmiFlag
hle_func 9144 HleStgWaitFrames
hle_func 9151 HleStgWaitFramesOrInput

# Task scheduler: $8D2E runs every task until it yields, and a task yields
# through $8D68, which saves its registers and switches to the next. Both
# are coroutine switches, not calls that return to their caller, so compiled
# callers hand them back to the frame driver's interpreter (src/gen_stubs.c).
hle_func 8d2e HleStgRunTasks
hle_func 8d68 HleStgTaskYield

# >>> BEGIN symbols.toml (generated — do not edit)
symbol 008000 I_RESET
force_lle 008000
symbol 0086c4 I_NMI
force_lle 0086c4
# <<< END symbols.toml
