format_version = 1
id = "strikegunnerstg.gameplay"
version = "1.0.0"
name = "Gameplay options"
author = "SlippyGetBackHere"
description = "Optional changes to how Strike Gunner S.T.G plays. Everything here is off by default; the stock game is unchanged unless you turn a feature on."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "strikegunnerstg-usa"
rom_sha256 = "05f14e6ed3394d9273e2397769a8acf1a9db646be6066e82269521e8eec53562"

[[feature]]
id = "infinite_lives"
name = "Infinite lives"
description = "Losing a life no longer uses up a spare life, so the game never ends. Works for both players. Extra lives, new games and continues behave as normal."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "infinite_lives"
id = "strikegunnerstg.infinite_lives"

[[feature]]
id = "all_weapons"
name = "All weapons every stage"
description = "Every special weapon stays available on the weapon select screen for the whole game, instead of being marked NO USE once it has been taken into a stage. Works for both players."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "all_weapons"
id = "strikegunnerstg.all_weapons"

[[feature]]
id = "custom_music"
name = "Custom music"
description = "Replace the game's music with your own WAV, MP3, OGG, FLAC or MSU-1 .pcm files. Put them in the folders inside the music folder (created the first time you play with this on): one folder per stage, plus title, weapon select, boss and an 'any' folder used for every empty one. Empty folders keep the original music. Sound effects are unchanged. The README.txt in the music folder explains seamless loops."
group = "Music"
default_enabled = false

[[plugin]]
feature = "custom_music"
id = "strikegunnerstg.custom_music"

[[option]]
feature = "custom_music"
id = "order"
label = "Order"
description = "How songs are picked when a folder has more than one."
type = "choice"
default = "sequential"

[[option.choice]]
value = "sequential"
label = "Sequential"

[[option.choice]]
value = "random"
label = "Random (never the same song twice in a row)"

[[option]]
feature = "custom_music"
id = "on_end"
label = "When a song ends"
type = "choice"
default = "loop"

[[option.choice]]
value = "loop"
label = "Loop it"

[[option.choice]]
value = "next"
label = "Play the next song"

[[option]]
feature = "custom_music"
id = "match_loudness"
label = "Match the game's music loudness"
description = "Scale each song to the level of the game's own music, so loud and quiet recordings sit alike next to the sound effects."
type = "boolean"
default = true

[[option]]
feature = "custom_music"
id = "volume"
label = "Music volume (%)"
description = "Your music's volume relative to the game's sound effects (applied after loudness matching)."
type = "integer"
default = 100
min = 0
max = 200
step = 10

[[option]]
feature = "custom_music"
id = "keep_jingles"
label = "Keep the original stage clear and game over jingles"
description = "They are timed to the game; a long song would be cut off after a few seconds."
type = "boolean"
default = true

[[option]]
feature = "custom_music"
id = "now_playing"
label = "Show Now Playing"
description = "Show the song's name for a few seconds when it starts, in small text at the bottom of the screen."
type = "boolean"
default = true

[[option]]
feature = "custom_music"
id = "now_playing_position"
label = "Now Playing position"
type = "choice"
default = "bottom_center"

[[option.choice]]
value = "bottom_center"
label = "Bottom centre"

[[option.choice]]
value = "bottom_right"
label = "Bottom right"

[[option]]
feature = "custom_music"
id = "skip_key"
label = "Skip to the next song"
description = "Keyboard key that moves to the next song in the folder that is playing."
type = "choice"
default = "n"

[[option.choice]]
value = "n"
label = "N"

[[option.choice]]
value = "m"
label = "M"

[[option.choice]]
value = "end"
label = "End"

[[option.choice]]
value = "backspace"
label = "Backspace"

[[option.choice]]
value = "none"
label = "None"

[[resource]]
feature = "custom_music"
id = "music_folder"
label = "Music folder"
description = "Leave empty to use the 'music' folder next to the game."
format = "directory"
required = false
